function loadData(source){let box={};try{if(source&&typeof source==='object')D=source;else{new Function('window',source)(box);D=box.FAREVER_REPORT_DATA}if(!D)throw 0}catch(e){$('#notice').className='card notice error';$('#notice').textContent='Impossible de charger les donn\u00e9es Farever. Cliquez sur le bouton de secours pour choisir farever-report-data.js.';return}const rows=D.atlasTsv.trim().split(/\r?\n/).map(x=>x.split('\t')),heads=(rows.shift()||[]).map(x=>x.replace(/^#\s*/,''));atlas=new Map();recipes=new Map();for(let r of rows){let o={};heads.forEach((h,i)=>o[h]=r[i]||'');if(o.category==='recipes'){let item=atlas.get(o.id)||{};o.desc=o.desc||item.desc;o.icon=o.icon||item.icon;o.tags=[...new Set([...(item.tags||'').split(','),...(o.tags||'').split(',')].filter(Boolean))].join(',');recipes.set(o.id,o)}else atlas.set(o.id,o)}inv=new Map(list(D.inventories).map(x=>[keyOf(x),x]));jobs=new Map(list(D.jobs).map(x=>[keyOf(x),x]));let names=[...new Set([...inv.keys(),...jobs.keys()])].sort();$('#hero').innerHTML=names.map(n=>'<option value="'+esc(n)+'">'+esc((inv.get(n)||jobs.get(n)||{}).character||n)+'</option>').join('');$('#characters').innerHTML=names.map(n=>{let ci=inv.get(n)||{},cc=ci.heroClass||ci.hero_class||'Classe inconnue';return '<button type="button" class="character-tag" data-character="'+esc(n)+'" data-class="'+esc(cc)+'"><b>'+esc(ci.character||n)+'</b><span>'+esc(cc)+' &mdash; niveau '+esc(ci.level||'?')+'</span>'+(ci.steamAccountId?'<small>uid '+esc(ci.steamAccountId)+'</small>':'')+'</button>'}).join('');$('#characters').querySelectorAll('[data-character]').forEach(b=>b.onclick=()=>{$('#hero').value=b.dataset.character;jobTab='';render()});let requested=new URLSearchParams(location.search).get('hero');if(requested&&names.includes(requested))$('#hero').value=requested;$('#hero').hidden=true;$('#search').hidden=true;$('#notice').hidden=true;render()}

function recipeInfo(a){
 let parts=String(a.acquire||'').split('|').map(x=>x.trim()),needs=parts.find(x=>x.startsWith('Needs:')),cost=parts.find(x=>x.startsWith('Cost:')),find=parts.some(x=>x.includes('Unlocked by a recipe you must find')||x.startsWith('Unlocked by:')),auto=!find&&parts.some(x=>x.includes('Known automatically')),sold=parts.some(x=>x.includes('Sold by a merchant')),items=needs?needs.slice(6).split(',').map(x=>x.trim()).filter(Boolean):[];
 let tags=String(a.tags||'').split(',').map(x=>x.trim()).filter(Boolean),tag=(key)=>tags.filter(x=>x.startsWith(key+':')).map(x=>x.slice(key.length+1)),rarities=['Commune','Peu commune','Rare','Epique','Legendaire'],r=Math.max(0,Math.min(4,Number(a.rarity)||0));

}
function iconTile(icon){let n=Number(icon);if(!Number.isInteger(n)||n<0)return '';let x=(n%32)*64,y=Math.floor(n/32)*64;return '<span class="item-icon" aria-label="Ic?ne" style="background-image:url(\'assets/farever-atlas-icons.png\');background-position:-'+x+'px -'+y+'px;background-size:2048px auto"></span>'}

function professions(j){let available=list(j.jobs).filter(x=>list(x.learned).length);if(!available.length)return '<p class="empty">Aucun m\u00e9tier avec des recettes.</p>';if(!available.some(x=>x.job===jobTab))jobTab=available[0].job;let nav='<div class="tabs">'+available.map(x=>'<button class="job '+(x.job===jobTab?'active':'')+'" data-job="'+esc(x.job)+'">'+esc(title(x.job))+' <small>niv. '+x.level+'</small></button>').join('')+'</div>';let current=available.find(x=>x.job===jobTab),groups=new Map();for(let id of list(current.learned)){let lv=recipeLevel(id,current.job);if(!groups.has(lv))groups.set(lv,[]);groups.get(lv).push({kind:id})}let levels=[...groups].sort((a,b)=>a[0]-b[0]).map(([lv,it],i)=>'<details '+(i===0?'open':'')+'><summary>Niveau '+(lv||'?')+' &mdash; '+it.length+' recette'+(it.length>1?'s':'')+'</summary><div class="grid">'+cards(it,'recipe')+'</div></details>').join('');return nav+'<div class="levels">'+levels+'</div>'}

function render(){if(!D)return;let n=$('#hero').value,i=inv.get(n)||{},j=jobs.get(n)||{},cls=heroTheme(i,i.character||n),tabs=['Inventaire','Banque commune','\u00c9quipement','M\u00e9tiers','Runes','Ma\u00eetrise','Collection'];let counts={'Inventaire':list(i.bags).length,'Banque commune':[...list(i.bank),...list(i.bankEquipment)].length,'\u00c9quipement':list(i.equipped).length,'M\u00e9tiers':list(j.jobs).length,'Runes':list(j.runes).length,'Ma\u00eetrise':list(j.weaponMastery).length};$('#stats').hidden=true;$('#tabs').innerHTML=tabs.map(x=>'<button class="'+(x===tab?'active':'')+'" data-tab="'+x+'">'+x+' <small>'+((counts[x]??''))+'</small></button>').join('');$('#characters').querySelectorAll('[data-character]').forEach(b=>b.classList.toggle('active',b.dataset.character===n));$('#footer-read').textContent='Derni?re lecture : '+(D.generatedAt||'?');let body='';if(tab==='Inventaire')body='<div class="grid">'+cards(list(i.bags))+'</div>';if(tab==='\u00c9quipement')body='<div class="grid">'+cards(list(i.equipped))+'</div>';if(tab==='Banque commune')body='<div class="grid">'+cards([...list(i.bank),...list(i.bankEquipment)])+'</div>';if(tab==='M\u00e9tiers')body=professions(j);if(tab==='Runes')body='<div class="grid">'+cards(j.runes)+'</div>';if(tab==='Ma\u00eetrise'){let mastery=[...list(j.weaponMastery)].sort((a,b)=>(Number(b.kills)||0)-(Number(a.kills)||0)),top=new Map(mastery.slice(0,4).map((x,n)=>[x.weapon,4-n]));body='<div class="grid">'+mastery.map(x=>{let a=atlas.get(x.weapon)||{},rank=top.get(x.weapon),border=rank?' rarity-card-'+rank:'';return '<article class="card item'+border+'">'+iconTile(a.icon)+'<h3>'+esc(title(x.weapon))+'</h3><span class="badge">'+esc(x.kills)+' victimes</span>'+(i.activeWeapon===x.weapon?'<span class="badge status-auto">Arme active</span>':'')+'</article>'}).join('')+'</div>'}if(tab==='Collection')body=Object.entries(D.collection||{}).filter(([,v])=>Array.isArray(v)).map(([k,v])=>'<h2>'+esc(k)+' ('+v.length+')</h2><div class="grid">'
